name: KaravanWebasto

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  KaravanWebasto:
    type: application
    platform: iOS

    sources:
      - path: KaravanWebasto/KaravanWebastoApp.swift
      - path: KaravanWebasto/ContentView.swift
      - path: KaravanWebasto/HeaterModels.swift
      - path: KaravanWebasto/HeatGenieProtocol.swift
      - path: KaravanWebasto/HeaterController.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karavanmasali.KaravanWebasto
        PRODUCT_NAME: KaravanWebasto
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: AppInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

    scheme:
      testTargets: []
